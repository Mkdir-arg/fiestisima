<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- Installability. Without apple-mobile-web-app-capable, iOS Safari
         offers a plain bookmark instead of a standalone app, which is how
         the venue's phone is meant to run this. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fiestisima" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- The `react-native-web` recommended style reset. -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* colors.bg from src/ui/tokens.ts, repeated as a literal because
           this file is static HTML served before any JS runs; without it
           the page flashes white on load. */
        background-color: #f2f2f7;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Per usare Fiestisima serve JavaScript attivo.</noscript>
    <div id="root"></div>
  </body>
</html>
