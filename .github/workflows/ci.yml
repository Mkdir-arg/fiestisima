name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  client:
    name: Expo client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          # src/lib/api.ts throws at module load without this; jest.setup.js
          # has the same fallback, this just makes the value explicit in CI.
          EXPO_PUBLIC_API_URL: https://api.test.invalid

  api:
    name: FastAPI
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major as fiestisima-db on Railway. The suite needs citext,
        # which ships with the stock image's contrib modules.
        image: postgres:18
        env:
          POSTGRES_USER: fiestisima
          POSTGRES_PASSWORD: fiestisima
          POSTGRES_DB: fiestisima
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fiestisima"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite connects as the table owner, exactly as the API does in
      # production; `as_user()` drops to app_user per transaction.
      DATABASE_URL: postgresql://fiestisima:fiestisima@localhost:5432/fiestisima
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Apply migrations
        run: uv run python scripts/migrate.py
      - name: Apply migrations again (idempotence)
        run: uv run python scripts/migrate.py
      - run: uv run pytest -q
